<style>
:root {
  color-scheme: light dark;
  --bg: #ffffff;
  --fg: #1f2328;
  --muted: #656d76;
  --border: #d0d7de;
  --code-bg: #f6f8fa;
  --accent: #0969da;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1117;
    --fg: #e6edf3;
    --muted: #8b949e;
    --border: #30363d;
    --code-bg: #161b22;
    --accent: #58a6ff;
  }
}

* { box-sizing: border-box; }

body {
  margin: 0;
  max-width: none;
  padding: 32px;
  background: var(--bg);
  color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 16px;
  line-height: 1.6;
  hyphens: manual;
  overflow-wrap: normal;
  word-break: normal;
}

a { color: var(--accent); }

h1, h2, h3, h4, h5, h6 {
  line-height: 1.25;
  margin-top: 24px;
  margin-bottom: 16px;
  font-weight: 600;
}

h1, h2 {
  padding-bottom: 0.3em;
  border-bottom: 1px solid var(--border);
}

pre, code, kbd, samp {
  font-family: ui-monospace, SFMono-Regular, "SF Mono", Consolas, "Liberation Mono", Menlo, monospace;
  font-size: 85%;
}

code {
  padding: 0.2em 0.4em;
  border-radius: 6px;
  background: var(--code-bg);
}

pre {
  overflow-x: auto;
  padding: 16px;
  border-radius: 6px;
  background: var(--code-bg);
}

pre code {
  padding: 0;
  background: transparent;
}

blockquote {
  padding: 0 1em;
  color: var(--muted);
  border-left: 0.25em solid var(--border);
}

img, svg {
  max-width: none;
}

.table-wrapper {
  width: 100%;
  overflow-x: auto;
  margin: 24px 0;
}

.table-wrapper table {
  display: table;
  width: auto;
  max-width: none;
  margin: 0;
  border-spacing: 0;
  border-collapse: collapse;
  table-layout: auto;
}

.table-wrapper col {
  width: auto !important;
}

th, td {
  padding: 6px 13px;
  border: 1px solid var(--border);
  overflow-wrap: normal;
  word-break: normal;
  vertical-align: top;
}

td code, th code {
  white-space: nowrap;
}

tr:nth-child(2n) {
  background: color-mix(in srgb, var(--code-bg) 70%, transparent);
}
</style>
<script>
(() => {
  const versionUrl = window.location.pathname.replace(/\.html$/, '.version');
  let currentVersion = null;

  function tableScrolls() {
    return Array.from(document.querySelectorAll('.table-wrapper'), (table) => table.scrollLeft);
  }

  function restoreScroll(state) {
    window.scrollTo(state.x, state.y);
    document.querySelectorAll('.table-wrapper').forEach((table, index) => {
      table.scrollLeft = state.tables[index] || 0;
    });
  }

  async function getVersion() {
    const response = await fetch(`${versionUrl}?t=${Date.now()}`, { cache: 'no-store' });
    return response.ok ? (await response.text()).trim() : null;
  }

  async function refreshIfChanged() {
    try {
      const nextVersion = await getVersion();
      if (!nextVersion) return;
      if (currentVersion === null) {
        currentVersion = nextVersion;
        return;
      }
      if (nextVersion === currentVersion) return;

      const state = { x: window.scrollX, y: window.scrollY, tables: tableScrolls() };
      const response = await fetch(`${window.location.pathname}?t=${Date.now()}`, { cache: 'no-store' });
      if (!response.ok) return;

      const nextDocument = new DOMParser().parseFromString(await response.text(), 'text/html');
      document.body.replaceWith(nextDocument.body);
      document.title = nextDocument.title;
      currentVersion = nextVersion;
      requestAnimationFrame(() => requestAnimationFrame(() => restoreScroll(state)));
    } catch (error) {
      console.warn('Markdown preview refresh failed', error);
    }
  }

  window.addEventListener('DOMContentLoaded', () => {
    refreshIfChanged();
    setInterval(refreshIfChanged, 1000);
  });
})();
</script>
