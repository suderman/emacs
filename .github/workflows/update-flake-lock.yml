name: Update flake.lock

on:
  # Started nightly by suderman/nixos's update-flake-lock workflow.
  workflow_dispatch:

jobs:
  update-flake-lock:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Nix
        # v27
        uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b

      - name: Update flake
        run: nix flake update

      # Moves packages added to use-package forms into Nix.
      - name: Update use-package list
        run: nix run .#update-use-packages

      - name: Commit and push if anything changed
        run: |
          if git diff --quiet flake.lock nix/packages/use-packages.json; then
            echo "No changes to flake.lock or use-packages.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flake.lock nix/packages/use-packages.json
          git commit -m "Automated flake.lock update"
          git push
